name: Keepalive
# Gratis Supabase-projekter pauses efter en uges inaktivitet. Dette job læser én række hver tredje dag.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_WhuPfaDfcTcZJhWwAcgvhg_YyhNG4lf" \
            "https://apagcfedizgjnnuefzfo.supabase.co/rest/v1/clubs?select=code&limit=1")
          echo "Status: $code"
          test "$code" = "200"
