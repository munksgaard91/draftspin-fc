name: Keepalive
# Gratis Supabase-projekter pauses efter en uges inaktivitet. Dette job læser én række hver tredje dag.
# GitHub deaktiverer planlagte jobs efter 60 dages inaktivitet i et repo, så jobbet laver også en lille commit de første dage hver måned.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_WhuPfaDfcTcZJhWwAcgvhg_YyhNG4lf" \
            "https://apagcfedizgjnnuefzfo.supabase.co/rest/v1/clubs?select=code&limit=1")
          echo "Status: $code"
          test "$code" = "200"
      - name: Hold repoet aktivt
        run: |
          if [ "$(date -u +%d)" -le 3 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keepalive: hold repoet aktivt" || exit 0
            git push
          fi
